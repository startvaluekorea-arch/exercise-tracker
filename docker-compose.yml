services:
  postgres:
    image: postgres:15-alpine
    container_name: exercise_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: exercisedb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exercise_web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/exercisedb
      - NEXT_PUBLIC_DEFAULT_USER_ID=00000000-0000-0000-0000-000000000001
    depends_on:
      - postgres

volumes:
  postgres_data:
